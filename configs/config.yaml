# All thresholds, schedules and paths for the static PE malware detector.
# Paths are relative to the repository root.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  registry_dir: data/processed/registry
  shap_reports_dir: data/processed/shap_reports
  eval_reports_dir: data/processed/eval_reports
  bundle_path: defender/model/bundle.joblib

# --- §3.1 labeling (AVClass-style consensus) --------------------------------
labeling:
  # SOREL-20M does not publish the number of engines that scanned each sample,
  # only the number flagging it. When the coverage column is missing the
  # coverage check is skipped (logged), rather than excluding every sample.
  min_engines_reporting: 10
  malicious_consensus_threshold: 5   # >= this many engines flag it -> MALICIOUS
  benign_consensus_threshold: 1      # <= this many engines flag it -> BENIGN
  relabel_window_days: 30

# --- §3.2 temporal split ------------------------------------------------------
# Boundaries match SOREL-20M's published split timestamps so that every
# sample's split is fixed before any other stage sees the data.
temporal_split:
  train_end: "2018-11-30T01:49:30Z"
  val_end: "2019-01-12T07:54:00Z"
  test_start: "2019-01-12T07:54:00Z"   # set later than val_end for a gap

# --- §3.3 sampling ------------------------------------------------------------
sampling:
  max_single_source_fraction: 0.8
  # benign:malicious ratio targeted in the val/test evaluation sets.
  eval_benign_to_malicious_ratio: 3.0
  random_seed: 1337
  # Compute budget (uniform random caps per label, applied before the
  # prevalence step). SOREL has ~20M samples; this keeps download and
  # training tractable.
  budget:
    train: {BENIGN: 180000, MALICIOUS: 120000}
    val: {MALICIOUS: 15000}
    test: {MALICIOUS: 20000}

# --- §4 features --------------------------------------------------------------
features:
  extractor_version: "1.0.0"

# --- §5 LSH pre-filter --------------------------------------------------------
# rows_per_band (MinHash values per bucket key) was tuned on the validation
# split: 1-2 give a few hundred very mixed buckets, 3 gives ~15k buckets with
# ~11% of validation traffic resolved by high-purity simple regions.
lsh:
  seed: 20240501
  mappings:
    structure_focused:
      rows_per_band: 3
    content_focused:
      rows_per_band: 3
  primary_mapping: structure_focused   # §5.2 option (a)

# --- §6 bucket state ----------------------------------------------------------
# hard_region_min_malicious_samples: the spec's default is 50. Tuned on the
# validation split to 2000: classifiers that only ever saw a few hundred
# malicious samples of their own bucket missed far more new malware than the
# fallback model (82.7% vs 94.3% TPR on the same samples), while buckets with
# >= 2000 malicious samples match or beat it.
buckets:
  hard_region_min_malicious_samples: 2000
  hard_region_min_benign_samples: 200
  # A single-class bucket needs at least this much training support before a
  # hash lookup alone is trusted to decide it. Smaller single-class buckets are
  # treated as hard regions without a classifier (routed per §10.2).
  simple_region_min_samples: 30

# --- §7 models ----------------------------------------------------------------
models:
  # Pooled benign samples given to each hard-region classifier (§7.2). Capped
  # so that per-bucket training stays tractable; drawn from all buckets.
  benign_pool_max: 40000
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_leaf: 1
    max_features: sqrt
    class_weight: balanced_subsample
    n_jobs: -1
  linear_svm:            # hinge-loss linear SVM (see src/models/baseline_svm.py)
    alpha: 1.0e-5          # L2 strength (~ 1 / (C * n_samples)); tuned on validation
    class_weight: balanced
    max_iter: 50
    tol: 1.0e-4
    calibration_cv: 3
    # SGD works in float64 and calibration refits per fold; 300k x 2394 does
    # not fit in 14 GB of RAM, so the SVM fallback uses a smaller random sample.
    fallback_max_train_samples: 150000
  # §10.2 secondary review: model used for hard buckets without a classifier
  # and for novel buckets. Trained on the whole training split.
  fallback:
    max_train_samples: 300000
    random_forest:
      n_estimators: 100
      max_depth: null
      min_samples_leaf: 2
      max_features: sqrt
      class_weight: balanced_subsample
      n_jobs: -1

# --- thresholds (calibrated on the validation split only) ---------------------
calibration:
  target_val_fpr: 0.005        # half of the 1% FPR goal, as margin for distribution shift
  # §10.2 fail-safe: the fallback threshold is lowered by this factor relative
  # to its FPR-calibrated value (never raised), biasing it toward "malicious".
  fallback_failsafe_factor: 1.0

# --- §8 retraining ------------------------------------------------------------
retrain:
  cadence_days: 30

# --- §9 SHAP audit ------------------------------------------------------------
shap_audit:
  top_k: 3
  background_samples: 100
  watch_list:
    - resources_entropy
    - resources_entry_count
    - header_entropy
    - header_timestamp

# --- serving ------------------------------------------------------------------
serving:
  port: 8080
  request_budget_seconds: 4.5
  max_upload_bytes: 16777216
  workers: 2
